<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>NGワードゲーム</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='room.css') }}">

    <!-- QRコード生成ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>

    <script>
        const roomId = "{{ room_id }}";
    </script>

    <script src="{{ url_for('static', filename='room.js') }}"
            defer>
    </script>
</head>

<body>

    <main id="game_area">

        <!-- 部屋情報 -->
        <div class="room-header">
            <div class="state">
                部屋ID：<span id="room_id">{{ room_id }}</span>
            </div>

            <div id="player_name"></div>
        </div>


        <!-- 名前入力 -->
        <section id="name">

            <input
                type="text"
                id="name_input"
                placeholder="名前を入力"
                maxlength="20"
                autocomplete="off"
            >

            <button
                id="name_button"
                onclick="decision()">
                決定
            </button>

        </section>


        <!-- 待機画面 -->
        <section id="waiting">

            <h1 class="waiting_text">
                開始待ち
            </h1>

            <div class="select-box" id="condition_select">

                <button
                    class="select-current"
                    onclick="toggleSelect()">

                    <span id="selected-condition">
                        お題を選択
                    </span>

                    <span>▼</span>

                </button>

                <div
                    class="select-options"
                    id="condition-options">

                    <!-- room.jsから選択肢を追加 -->

                </div>

            </div>


            <button
                class="start-button"
                id="start_button"
                onclick="startGame()">

                開始

            </button>

        </section>


        <!-- ゲーム画面 -->
        <section id="game">

            <h2>
                NGワード
            </h2>

            <div id="game_text"></div>

            <button
                class="end-button"
                onclick="endGame()">

                終了

            </button>

        </section>


        <!-- 継続確認画面 -->
        <section id="select">

            <h1>
                ゲームを続けますか？
            </h1>

            <div class="select-buttons">

                <button
                    id="select_continue"
                    onclick="continueGame()">

                    継続

                </button>

                <button
                    id="select_end"
                    onclick="finishGame()">

                    終了

                </button>

            </div>

        </section>


        <!-- 部屋URLのQRコード -->
        <section id="qr_area">

            <h2>
                参加用QRコード
            </h2>

            <div id="qrcode"></div>

            <p id="qr_url"></p>

        </section>

    </main>


    <!-- 参加者一覧 -->
    <aside id="name_area">

        <h2>
            参加者
        </h2>

        <ul id="player_list"></ul>

    </aside>


    <!-- QRコード生成 -->
    <script>

        window.addEventListener("load", function () {

            const currentUrl = window.location.href;

            const qrElement = document.getElementById("qrcode");
            const urlElement = document.getElementById("qr_url");

            urlElement.textContent = currentUrl;

            new QRCode(qrElement, {
                text: currentUrl,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

        });

    </script>

</body>
</html>
