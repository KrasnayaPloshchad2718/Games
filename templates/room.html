<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NGWordGame</title>

    <link
        rel="stylesheet"
        href="/static/room.css"
    >

    <script>
        const roomId = "{{ room_id }}";
    </script>

    <script
        src="/static/room.js"
        defer
    ></script>

</head>

<body>

    <section id="game_area">

        <!-- 部屋番号 -->

        <div
            class="state"
            id="room_id"
        >
            {{ room_id }}
        </div>


        <!-- プレイヤー名 -->

        <div
            class="state"
            id="player_name"
        ></div>


        <!-- ============================== -->
        <!-- 名前入力 -->
        <!-- ============================== -->

        <div id="name">

            <input
                type="text"
                id="name_input"
                placeholder="名前を入力"
                autocomplete="off"
            >

            <button
                id="name_button"
                onclick="decision()"
            >
                決定
            </button>

        </div>


        <!-- ============================== -->
        <!-- 待機画面 -->
        <!-- ============================== -->

        <div
            id="waiting"
            style="display: none;"
        >

            <p>待機中...</p>


            <!-- 条件選択 -->

            <div
                class="select-box"
                id="game-select"
            >

                <button
                    class="select-current"
                    type="button"
                >
                    条件を選択
                    <span>▼</span>
                </button>

                <div
                    class="select-options"
                ></div>

            </div>


            <!-- 開始ボタン -->

            <button
                class="select-box"
                id="start_button"
                onclick="startGame()"
            >
                開始
            </button>

        </div>


        <!-- ============================== -->
        <!-- ゲーム画面 -->
        <!-- ============================== -->

        <div
            id="game"
            style="display: none;"
        >

            <h2 id="game_title">
                ↓各プレイヤーのワード一覧
            </h2>


            <h3 id="game_text"></h3>


            <!-- 終了ボタン -->

            <button
                id="end_game"
                onclick="endGame()"
            >

                <h2>終了</h2>

            </button>

        </div>


        <!-- ============================== -->
        <!-- 継続・終了選択画面 -->
        <!-- ============================== -->

        <div
            id="select"
            style="display: none;"
        >

            <h1>
                ゲームを続けますか？
            </h1>


            <!-- 継続 -->

            <button
                id="select_continue"
                onclick="continueGame()"
            >
                再スタート
            </button>


            <!-- 終了 -->

            <button
                id="select_end"
                onclick="finishGame()"
            >
                終了
            </button>

        </div>

    </section>


    <!-- ============================== -->
    <!-- 参加者一覧 -->
    <!-- ============================== -->

    <aside id="name_area">

        <h2>参加者</h2>

        <ul id="player_list">

            <!-- JSでここに参加者を追加 -->

        </ul>

    </aside>

</body>

</html>
